<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Erreur de démarrage — StitchFlow</title>
  <style>
    body {
      background: #1a1a2e;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 40px;
      text-align: center;
    }
    h1 { color: #f87171; font-size: 1.5rem; }
    p { color: #94a3b8; max-width: 500px; line-height: 1.6; }
    a { color: #a78bfa; }
    .hint {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px 24px;
      font-size: 0.85rem;
      color: #64748b;
      max-width: 500px;
      text-align: left;
    }
    code { color: #f472b6; font-family: monospace; }
  </style>
</head>
<body>
  <h1>Impossible de démarrer StitchFlow</h1>
  <p>Le serveur Django n'a pas répondu dans les délais attendus.</p>
  <div class="hint">
    <strong>Solutions possibles :</strong><br><br>
    • Vérifiez que Python est installé<br>
    • Vérifiez que le venv <code>.venv/</code> est présent<br>
    • Relancez l'application<br><br>
    En cas de problème persistant, consultez le <a href="https://github.com/Sollvoo/stitchflow-desktop">GitHub</a>.
  </div>
</body>
</html>
