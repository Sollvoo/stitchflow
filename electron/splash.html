<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StitchFlow</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background:
        radial-gradient(circle at top left, rgba(232, 99, 74, 0.10), transparent 28%),
        radial-gradient(circle at top right, rgba(79, 127, 148, 0.08), transparent 24%),
        #F8F3EB;
      color: #1C1917;
      font-family: Aptos, "Segoe UI", sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      -webkit-app-region: drag;
    }
    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .logo {
      width: min(56vw, 240px);
      height: auto;
    }
    .subtitle {
      font-size: 0.78rem;
      color: #78716C;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(232, 99, 74, 0.18);
      border-top-color: #E8634A;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading-text {
      font-size: 0.8rem;
      color: #98826E;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <img class="logo" src="../assets/brand/logo-horizontal.svg" alt="StitchFlow">
    <div class="subtitle">Broderie numerique</div>
  </div>
  <div class="spinner"></div>
  <div class="loading-text">Demarrage en cours...</div>
</body>
</html>
