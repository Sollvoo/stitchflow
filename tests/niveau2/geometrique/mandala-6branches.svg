<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <rect width="500" height="500" fill="#1a1a2e"/>
  <!-- Cercles concentriques -->
  <circle cx="250" cy="250" r="220" fill="none" stroke="#c9a84c" stroke-width="2"/>
  <circle cx="250" cy="250" r="180" fill="none" stroke="#c9a84c" stroke-width="1"/>
  <circle cx="250" cy="250" r="60"  fill="#c9a84c"/>
  <circle cx="250" cy="250" r="40"  fill="#1a1a2e"/>
  <circle cx="250" cy="250" r="20"  fill="#c9a84c"/>
  <!-- 6 pétales principaux -->
  <ellipse cx="250" cy="130" rx="30" ry="80" fill="#e74c3c" transform="rotate(0 250 250)"/>
  <ellipse cx="250" cy="130" rx="30" ry="80" fill="#e67e22" transform="rotate(60 250 250)"/>
  <ellipse cx="250" cy="130" rx="30" ry="80" fill="#f1c40f" transform="rotate(120 250 250)"/>
  <ellipse cx="250" cy="130" rx="30" ry="80" fill="#2ecc71" transform="rotate(180 250 250)"/>
  <ellipse cx="250" cy="130" rx="30" ry="80" fill="#3498db" transform="rotate(240 250 250)"/>
  <ellipse cx="250" cy="130" rx="30" ry="80" fill="#9b59b6" transform="rotate(300 250 250)"/>
  <!-- 6 petits pétales intermédiaires -->
  <ellipse cx="250" cy="160" rx="14" ry="50" fill="#ecf0f1" transform="rotate(30 250 250)"/>
  <ellipse cx="250" cy="160" rx="14" ry="50" fill="#ecf0f1" transform="rotate(90 250 250)"/>
  <ellipse cx="250" cy="160" rx="14" ry="50" fill="#ecf0f1" transform="rotate(150 250 250)"/>
  <ellipse cx="250" cy="160" rx="14" ry="50" fill="#ecf0f1" transform="rotate(210 250 250)"/>
  <ellipse cx="250" cy="160" rx="14" ry="50" fill="#ecf0f1" transform="rotate(270 250 250)"/>
  <ellipse cx="250" cy="160" rx="14" ry="50" fill="#ecf0f1" transform="rotate(330 250 250)"/>
  <!-- Cercle central final -->
  <circle cx="250" cy="250" r="220" fill="none" stroke="#c9a84c" stroke-width="3"/>
</svg>
