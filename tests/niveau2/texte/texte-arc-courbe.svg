<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300">
  <rect width="500" height="300" fill="#f8f4e8"/>
  <!-- Ligne décorative -->
  <path d="M 50,260 Q 250,240 450,260" fill="none" stroke="#8B6914" stroke-width="2"/>
  <path d="M 50,270 Q 250,250 450,270" fill="none" stroke="#8B6914" stroke-width="1"/>
  <!-- Texte principal en arc -->
  <path id="main-arc" d="M 40,220 Q 250,60 460,220" fill="none"/>
  <text font-family="Georgia,serif" font-size="52" font-weight="bold" fill="#2c1810">
    <textPath href="#main-arc" startOffset="8%">Atelier Broderie</textPath>
  </text>
  <!-- Sous-texte droit -->
  <text x="250" y="285" font-family="Georgia,serif" font-size="22" fill="#8B6914"
        text-anchor="middle" font-style="italic">Artisanat &amp; Tradition</text>
</svg>
