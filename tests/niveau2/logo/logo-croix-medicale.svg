<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="white"/>
  <!-- Croix principale -->
  <rect x="140" y="40"  width="120" height="320" rx="12" fill="#e74c3c"/>
  <rect x="40"  y="140" width="320" height="120" rx="12" fill="#e74c3c"/>
  <!-- Contour -->
  <rect x="140" y="40"  width="120" height="320" rx="12" fill="none" stroke="#c0392b" stroke-width="3"/>
  <rect x="40"  y="140" width="320" height="120" rx="12" fill="none" stroke="#c0392b" stroke-width="3"/>
  <!-- Cercle blanc central -->
  <circle cx="200" cy="200" r="48" fill="white"/>
  <!-- Petit plus blanc dans cercle -->
  <rect x="188" y="168" width="24" height="64" rx="4" fill="#e74c3c"/>
  <rect x="168" y="188" width="64" height="24" rx="4" fill="#e74c3c"/>
  <!-- Ombre légère cercle -->
  <circle cx="200" cy="200" r="48" fill="none" stroke="#c0392b" stroke-width="2"/>
</svg>
