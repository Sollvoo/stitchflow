{% extends "base.html" %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-12">
  <div class="sf-panel w-full max-w-md">
    <div class="p-8 flex flex-col gap-5 text-center">
      <div class="text-5xl">📬</div>
      <h1 class="font-display font-bold text-xl">Email envoyé</h1>
      <p class="text-sm text-base-content/60">
        Si un compte correspond à cette adresse, vous allez recevoir un email avec un lien de réinitialisation.<br>
        <span class="text-base-content/40 text-xs">Le lien est valable 24 heures.</span>
      </p>
      <a href="{% url 'users:login' %}" class="btn btn-primary w-full mt-2">Retour à la connexion</a>
    </div>
  </div>
</div>
{% endblock %}
