{% extends "base.html" %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-12">
  <div class="sf-panel w-full max-w-md">
    <div class="p-8 flex flex-col gap-5">

      <div class="text-center">
        <div class="text-4xl mb-2">🔑</div>
        <h1 class="font-display font-bold text-xl">Mot de passe oublié</h1>
        <p class="text-sm text-base-content/50 mt-1">Entrez votre email pour recevoir un lien de réinitialisation.</p>
      </div>

      <form method="post" class="flex flex-col gap-4">
        {% csrf_token %}
        <label class="form-control w-full">
          <div class="label pb-1"><span class="label-text text-sm font-medium">Email</span></div>
          <input type="email" name="email"
                 placeholder="votre@email.com"
                 autocomplete="email"
                 class="input input-bordered w-full" required>
        </label>
        <button type="submit" class="btn btn-primary w-full">Envoyer le lien</button>
      </form>

      <p class="text-center text-sm text-base-content/60">
        <a href="{% url 'users:login' %}" class="link link-primary">Retour à la connexion</a>
      </p>

    </div>
  </div>
</div>
{% endblock %}
