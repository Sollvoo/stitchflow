{% extends "base.html" %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-12">
  <div class="card bg-base-100 shadow-lg w-full max-w-sm">
    <div class="card-body gap-5">

      <div class="text-center">
        <div class="w-16 h-16 rounded-full bg-primary/10 flex items-center justify-center text-2xl mx-auto mb-2">
          {{ user.first_name|slice:":1"|upper|default:"👤" }}
        </div>
        <h1 class="text-xl font-bold">Mon profil</h1>
        <p class="text-sm text-base-content/50 mt-0.5">{{ user.email }}</p>
      </div>

      {% if messages %}
      {% for message in messages %}
      <div class="alert {% if message.tags == 'success' %}alert-success{% else %}alert-info{% endif %} text-sm py-2">
        {{ message }}
      </div>
      {% endfor %}
      {% endif %}

      <form method="post" class="flex flex-col gap-4">
        {% csrf_token %}

        <div class="grid grid-cols-2 gap-3">
          <label class="form-control">
            <div class="label pb-1"><span class="label-text text-sm font-medium">Prénom</span></div>
            <input type="text" name="first_name" value="{{ form.first_name.value|default:'' }}"
                   placeholder="Marie"
                   autocomplete="given-name"
                   class="input input-bordered input-sm">
          </label>
          <label class="form-control">
            <div class="label pb-1"><span class="label-text text-sm font-medium">Nom</span></div>
            <input type="text" name="last_name" value="{{ form.last_name.value|default:'' }}"
                   placeholder="Dupont"
                   autocomplete="family-name"
                   class="input input-bordered input-sm">
          </label>
        </div>

        <label class="form-control">
          <div class="label pb-1"><span class="label-text text-sm font-medium">Email</span></div>
          <input type="email" value="{{ user.email }}" disabled
                 class="input input-bordered input-sm opacity-50 cursor-not-allowed">
          <div class="label"><span class="label-text-alt text-base-content/40">Non modifiable</span></div>
        </label>

        <button type="submit" class="btn btn-primary btn-sm mt-1">Sauvegarder</button>
      </form>

      <div class="divider text-xs text-base-content/30"></div>

      <div class="flex flex-col gap-2">
        <a href="{% url 'conversions:job_list' %}" class="btn btn-ghost btn-sm justify-start gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
          </svg>
          Mes conversions
        </a>

        <form method="post" action="{% url 'users:logout' %}">
          {% csrf_token %}
          <button type="submit" class="btn btn-ghost btn-sm text-error justify-start gap-2 w-full">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
            Se déconnecter
          </button>
        </form>
      </div>

    </div>
  </div>
</div>
{% endblock %}
