{% extends "base.html" %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-12">
  <div class="card bg-base-100 shadow-lg w-full max-w-md">
    <div class="card-body gap-5">

      <div class="text-center">
        <div class="text-4xl mb-2">🔐</div>
        <h1 class="text-xl font-bold">Changer le mot de passe</h1>
        <p class="text-sm text-base-content/50 mt-1">Saisissez votre mot de passe actuel puis choisissez-en un nouveau.</p>
      </div>

      {% if form.non_field_errors %}
      <div class="alert alert-error text-sm py-2">
        {% for error in form.non_field_errors %}{{ error }}{% endfor %}
      </div>
      {% endif %}

      <form method="post" class="flex flex-col gap-4">
        {% csrf_token %}
        <label class="form-control w-full">
          <div class="label pb-1"><span class="label-text text-sm font-medium">Mot de passe actuel</span></div>
          <input type="password" name="old_password"
                 placeholder="••••••••"
                 autocomplete="current-password"
                 class="input input-bordered w-full {% if form.old_password.errors %}input-error{% endif %}">
          {% if form.old_password.errors %}
          <div class="label"><span class="label-text-alt text-error">{{ form.old_password.errors.0 }}</span></div>
          {% endif %}
        </label>
        <label class="form-control w-full">
          <div class="label pb-1"><span class="label-text text-sm font-medium">Nouveau mot de passe</span></div>
          <input type="password" name="new_password1"
                 placeholder="8 caractères minimum"
                 autocomplete="new-password"
                 class="input input-bordered w-full {% if form.new_password1.errors %}input-error{% endif %}">
          {% if form.new_password1.errors %}
          <div class="label"><span class="label-text-alt text-error">{{ form.new_password1.errors.0 }}</span></div>
          {% endif %}
        </label>
        <label class="form-control w-full">
          <div class="label pb-1"><span class="label-text text-sm font-medium">Confirmer</span></div>
          <input type="password" name="new_password2"
                 placeholder="••••••••"
                 autocomplete="new-password"
                 class="input input-bordered w-full {% if form.new_password2.errors %}input-error{% endif %}">
          {% if form.new_password2.errors %}
          <div class="label"><span class="label-text-alt text-error">{{ form.new_password2.errors.0 }}</span></div>
          {% endif %}
        </label>
        <button type="submit" class="btn btn-primary w-full mt-1">Changer le mot de passe</button>
      </form>

      <p class="text-center text-sm text-base-content/60">
        <a href="{% url 'users:profile' %}" class="link link-primary">Retour au profil</a>
      </p>

    </div>
  </div>
</div>
{% endblock %}
