{% extends "base.html" %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-12">
  <div class="card bg-base-100 shadow-lg w-full max-w-md">
    <div class="card-body gap-5">

      <div class="text-center">
        <div class="text-4xl mb-2">📧</div>
        <h1 class="text-xl font-bold">Changer l'adresse email</h1>
        <p class="text-sm text-base-content/50 mt-1">Email actuel : <span class="font-medium">{{ user.email }}</span></p>
      </div>

      {% if form.non_field_errors %}
      <div class="alert alert-error text-sm py-2">
        {% for error in form.non_field_errors %}{{ error }}{% endfor %}
      </div>
      {% endif %}

      <form method="post" class="flex flex-col gap-4">
        {% csrf_token %}
        <label class="form-control w-full">
          <div class="label pb-1"><span class="label-text text-sm font-medium">Nouvel email</span></div>
          <input type="email" name="email" value="{{ form.email.value|default:'' }}"
                 placeholder="nouveau@email.com"
                 autocomplete="email"
                 class="input input-bordered w-full {% if form.email.errors %}input-error{% endif %}">
          {% if form.email.errors %}
          <div class="label"><span class="label-text-alt text-error">{{ form.email.errors.0 }}</span></div>
          {% endif %}
        </label>
        <label class="form-control w-full">
          <div class="label pb-1"><span class="label-text text-sm font-medium">Mot de passe actuel (confirmation)</span></div>
          <input type="password" name="password"
                 placeholder="••••••••"
                 autocomplete="current-password"
                 class="input input-bordered w-full {% if form.password.errors %}input-error{% endif %}">
          {% if form.password.errors %}
          <div class="label"><span class="label-text-alt text-error">{{ form.password.errors.0 }}</span></div>
          {% endif %}
        </label>
        <button type="submit" class="btn btn-primary w-full mt-1">Mettre à jour l'email</button>
      </form>

      <p class="text-center text-sm text-base-content/60">
        <a href="{% url 'users:profile' %}" class="link link-primary">Retour au profil</a>
      </p>

    </div>
  </div>
</div>
{% endblock %}
