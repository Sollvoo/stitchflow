<div class="form-control">
  <label class="label cursor-pointer justify-start gap-3">
    <input
      type="checkbox"
      name="{{ form.remove_background.html_name }}"
      class="checkbox checkbox-primary"
      x-model="removeBg"
    />
    <div>
      <span class="label-text font-medium">Supprimer le fond automatiquement</span>
      <span class="label-text-alt text-base-content/40 block">Recommandé pour les logos sur fond blanc — utilise l'IA (rembg)</span>
    </div>
  </label>
</div>

<div class="form-control">
  <label class="label pb-1">
    <span class="label-text font-medium">Nombre de couleurs de fil</span>
    <span class="label-text-alt text-base-content/60 font-semibold" x-text="nColors + ' couleur' + (nColors > 1 ? 's' : '')"></span>
  </label>
  <input
    type="range"
    name="{{ form.n_colors.html_name }}"
    min="2"
    max="16"
    step="1"
    class="range range-primary range-sm"
    x-model="nColors"
  />
  <div class="flex justify-between text-xs text-base-content/30 mt-1 px-1">
    <span>2 (simple)</span>
    <span>16 (complexe)</span>
  </div>
  <label class="label pt-1">
    <span class="label-text-alt text-base-content/40">Plus de couleurs = design plus détaillé, mais broderie plus longue.</span>
  </label>
</div>

<div class="form-control">
  <label class="label pb-1">
    <span class="label-text font-medium">Largeur souhaitée <span class="text-base-content/40 font-normal">(optionnel)</span></span>
    <span class="label-text-alt text-base-content/40">20 – 360 mm</span>
  </label>
  <div class="flex items-center gap-2">
    <input
      type="number"
      name="{{ form.target_width_mm.html_name }}"
      min="20"
      max="360"
      placeholder="Ex : 80"
      class="input input-bordered input-sm w-28"
      x-model="targetWidth"
    />
    <span class="text-sm text-base-content/50 shrink-0">mm</span>
  </div>
  <label class="label pt-1">
    <span class="label-text-alt text-base-content/40">Laisser vide pour conserver les dimensions vectorisées. Le ratio est préservé.</span>
  </label>
</div>
