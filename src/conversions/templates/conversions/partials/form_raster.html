<!-- Supprimer le fond -->
<label class="flex items-start gap-3 cursor-pointer rounded-xl border border-base-200 bg-base-100/60 px-4 py-3 hover:border-primary/30 hover:bg-primary/5 transition-all">
  <input
    type="checkbox"
    name="{{ form.remove_background.html_name }}"
    class="checkbox checkbox-primary checkbox-sm mt-0.5 shrink-0"
    x-model="removeBg"
  />
  <div class="min-w-0">
    <p class="text-sm font-medium leading-tight">Supprimer le fond</p>
    <p class="text-xs text-base-content/40 mt-0.5">Pour logos sur fond blanc — utilise l'IA (rembg)</p>
  </div>
</label>

<!-- Nombre de couleurs -->
<div class="rounded-xl border border-base-200 bg-base-100/60 px-4 py-3">
  <div class="flex items-center justify-between mb-2">
    <p class="text-sm font-medium">Couleurs de fil</p>
    <span class="text-sm font-bold text-primary tabular-nums" x-text="nColors + ' couleur' + (nColors > 1 ? 's' : '')"></span>
  </div>
  <input
    type="range"
    name="{{ form.n_colors.html_name }}"
    min="2"
    max="16"
    step="1"
    class="range range-primary range-xs w-full"
    x-model="nColors"
    @input="$dispatch('ncolors-changed', { value: parseInt(nColors) })"
  />
  <div class="flex justify-between text-[10px] text-base-content/30 mt-1">
    <span>2 — simple</span>
    <span>16 — complexe</span>
  </div>
</div>

<!-- Largeur cible -->
<div class="rounded-xl border border-base-200 bg-base-100/60 px-4 py-3">
  <div class="flex items-center justify-between gap-4">
    <div class="min-w-0">
      <p class="text-sm font-medium">Largeur souhaitée <span class="text-base-content/40 font-normal text-xs">(optionnel)</span></p>
      <p class="text-xs text-base-content/35 mt-0.5">Laissez vide → dimensions vectorisées conservées</p>
    </div>
    <div class="flex items-center gap-1.5 shrink-0">
      <input
        type="number"
        name="{{ form.target_width_mm.html_name }}"
        min="20"
        max="360"
        placeholder="—"
        class="input input-bordered input-sm w-20 text-right font-mono"
        x-model="targetWidth"
      />
      <span class="text-xs text-base-content/50 font-medium">mm</span>
    </div>
  </div>
</div>
