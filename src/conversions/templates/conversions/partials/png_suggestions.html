<div id="png-suggestions"
     class="alert alert-info py-3 px-4 text-sm gap-2 mt-2"
     data-n-colors="{{ n_colors }}"
     data-remove-bg="{{ has_white_background|yesno:'true,false' }}"
     data-width="{{ suggested_width }}">
  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
  </svg>
  <div>
    <span class="font-medium">Analyse automatique</span> —
    <strong>{{ n_colors }} couleur{{ n_colors|pluralize }}</strong> détectée{{ n_colors|pluralize }},
    largeur <strong>{{ suggested_width }} mm</strong>,
    suppression fond : <strong>{% if has_white_background %}activée (fond blanc détecté){% else %}désactivée{% endif %}</strong>.
    Paramètres appliqués — modifiez-les si besoin.
  </div>
</div>
