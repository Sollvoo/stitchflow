name: Build Desktop App

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─── macOS Apple Silicon (ARM64) ────────────────────────────────────────────
  build-mac-arm:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create venv + install Python deps
        run: |
          python3 -m venv --copies .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pyinstaller

      - name: Download vtracer (ARM64 macOS)
        run: |
          curl -fsSL -o /tmp/vtracer.tar.gz \
            https://github.com/visioncortex/vtracer/releases/download/0.6.4/vtracer-aarch64-apple-darwin.tar.gz
          mkdir -p vendor
          tar -xzf /tmp/vtracer.tar.gz -C vendor/
          chmod +x vendor/vtracer

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Vite frontend
        run: |
          cd src/frontend
          npm install
          npm run build

      - name: Build frozen Django backend
        run: |
          .venv/bin/pyinstaller --noconfirm --clean --distpath dist-backend --workpath build/pyinstaller scripts/desktop_backend.spec
          test -x dist-backend/stitchflow-backend/stitchflow-backend

      - name: Verify frozen Django backend
        run: |
          STITCH_USERDATA="$RUNNER_TEMP/stitchflow-userdata" \
          STITCH_VENDOR_PATH="$PWD/vendor" \
          dist-backend/stitchflow-backend/stitchflow-backend --migrate

          STITCH_USERDATA="$RUNNER_TEMP/stitchflow-userdata" \
          STITCH_VENDOR_PATH="$PWD/vendor" \
          dist-backend/stitchflow-backend/stitchflow-backend --check

          STITCH_USERDATA="$RUNNER_TEMP/stitchflow-userdata" \
          STITCH_VENDOR_PATH="$PWD/vendor" \
          dist-backend/stitchflow-backend/stitchflow-backend --port 8765 > "$RUNNER_TEMP/stitchflow-backend.log" 2>&1 &
          backend_pid=$!
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8765/healthz/ && curl -fsS http://127.0.0.1:8765/ | grep -q "StitchFlow"; then
              kill "$backend_pid"
              wait "$backend_pid" || true
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/stitchflow-backend.log"
          kill "$backend_pid" || true
          exit 1

      - name: Install root npm deps
        run: npm ci

      - name: Warn when macOS signing secrets are missing
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for var in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            if [ -z "${!var}" ]; then
              echo "::warning::$var is missing; macOS build will be unsigned/not notarized"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "::notice::Unsigned macOS releases are acceptable for free beta distribution, but users must bypass Gatekeeper manually."
          fi

      - name: Build macOS ARM64 DMG and ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:mac-arm

  # ─── macOS Intel (x64) ──────────────────────────────────────────────────────
  build-mac-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create venv + install Python deps
        run: |
          python3 -m venv --copies .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pyinstaller

      - name: Download vtracer (Intel macOS)
        run: |
          curl -fsSL -o /tmp/vtracer.tar.gz \
            https://github.com/visioncortex/vtracer/releases/download/0.6.4/vtracer-x86_64-apple-darwin.tar.gz
          mkdir -p vendor
          tar -xzf /tmp/vtracer.tar.gz -C vendor/
          chmod +x vendor/vtracer

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Vite frontend
        run: |
          cd src/frontend
          npm install
          npm run build

      - name: Build frozen Django backend
        run: |
          .venv/bin/pyinstaller --noconfirm --clean --distpath dist-backend --workpath build/pyinstaller scripts/desktop_backend.spec
          test -x dist-backend/stitchflow-backend/stitchflow-backend

      - name: Verify frozen Django backend
        run: |
          STITCH_USERDATA="$RUNNER_TEMP/stitchflow-userdata" \
          STITCH_VENDOR_PATH="$PWD/vendor" \
          dist-backend/stitchflow-backend/stitchflow-backend --migrate

          STITCH_USERDATA="$RUNNER_TEMP/stitchflow-userdata" \
          STITCH_VENDOR_PATH="$PWD/vendor" \
          dist-backend/stitchflow-backend/stitchflow-backend --check

          STITCH_USERDATA="$RUNNER_TEMP/stitchflow-userdata" \
          STITCH_VENDOR_PATH="$PWD/vendor" \
          dist-backend/stitchflow-backend/stitchflow-backend --port 8765 > "$RUNNER_TEMP/stitchflow-backend.log" 2>&1 &
          backend_pid=$!
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8765/healthz/ && curl -fsS http://127.0.0.1:8765/ | grep -q "StitchFlow"; then
              kill "$backend_pid"
              wait "$backend_pid" || true
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/stitchflow-backend.log"
          kill "$backend_pid" || true
          exit 1

      - name: Install root npm deps
        run: npm ci

      - name: Warn when macOS signing secrets are missing
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for var in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            if [ -z "${!var}" ]; then
              echo "::warning::$var is missing; macOS build will be unsigned/not notarized"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "::notice::Unsigned macOS releases are acceptable for free beta distribution, but users must bypass Gatekeeper manually."
          fi

      - name: Build macOS Intel ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:mac-intel-zip

  # ─── Windows x64 ────────────────────────────────────────────────────────────
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create venv + install Python deps
        run: |
          python -m venv .venv
          .venv\Scripts\pip install --upgrade pip
          .venv\Scripts\pip install -r requirements.txt
          .venv\Scripts\pip install pyinstaller

      - name: Download vtracer (Windows x64)
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/visioncortex/vtracer/releases/download/0.6.4/vtracer-x86_64-pc-windows-msvc.zip" `
            -OutFile "vtracer.zip"
          New-Item -ItemType Directory -Force -Path vendor | Out-Null
          Expand-Archive -Path vtracer.zip -DestinationPath vendor_tmp -Force
          # Handle whether .exe is at root or in a subfolder
          $exe = Get-ChildItem -Path vendor_tmp -Recurse -Filter vtracer.exe | Select-Object -First 1
          if ($exe) { Move-Item $exe.FullName vendor\vtracer.exe }
          Remove-Item vendor_tmp -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item vtracer.zip

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Vite frontend
        shell: bash
        run: cd src/frontend && npm install && npm run build

      - name: Build frozen Django backend
        run: |
          .venv\Scripts\pyinstaller --noconfirm --clean --distpath dist-backend --workpath build\pyinstaller scripts\desktop_backend.spec
          if (!(Test-Path dist-backend\stitchflow-backend\stitchflow-backend.exe)) { throw "Frozen backend missing" }

      - name: Verify frozen Django backend
        shell: bash
        run: |
          STITCH_USERDATA="$RUNNER_TEMP/stitchflow-userdata" \
          STITCH_VENDOR_PATH="$PWD/vendor" \
          ./dist-backend/stitchflow-backend/stitchflow-backend.exe --migrate

          STITCH_USERDATA="$RUNNER_TEMP/stitchflow-userdata" \
          STITCH_VENDOR_PATH="$PWD/vendor" \
          ./dist-backend/stitchflow-backend/stitchflow-backend.exe --check

          STITCH_USERDATA="$RUNNER_TEMP/stitchflow-userdata" \
          STITCH_VENDOR_PATH="$PWD/vendor" \
          ./dist-backend/stitchflow-backend/stitchflow-backend.exe --port 8765 > "$RUNNER_TEMP/stitchflow-backend.log" 2>&1 &
          backend_pid=$!
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8765/healthz/ && curl -fsS http://127.0.0.1:8765/ | grep -q "StitchFlow"; then
              kill "$backend_pid"
              wait "$backend_pid" || true
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/stitchflow-backend.log"
          kill "$backend_pid" || true
          exit 1

      - name: Install root npm deps
        run: npm ci

      - name: Build Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run build:win
