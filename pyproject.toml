[project]
name = "stitchflow"
version = "0.1.0"
description = "Application web Django de conversion SVG vers fichiers de broderie PES"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0",
    "celery[redis]>=5.3",
    "redis>=5.0",
    "django-vite>=3.0",
    "pyembroidery>=1.5",
    "python-decouple>=3.8",
    "pillow>=10.0",
    "dj-database-url>=2.0",
    "vtracer>=0.6",
    "pdf2image>=1.17",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1",
]
ai = [
    "rembg>=2.0",
]
dev = [
    "django-debug-toolbar",
    "ruff>=0.15",
]

[tool.black]
line-length = 88
target-version = ['py312']
extend-exclude = '''
/(\.git|\.venv|migrations)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
